[Proxy Group]
# “默认” 选择组，一键切换所有区域
Default-Region = select,中国大陆,香港,台湾,美国,加拿大,英国,欧洲,澳大利亚,日本,韩国,新加坡,印度,俄罗斯,巴西,土耳其,中东,东南亚,其他,url = http://www.gstatic.com/generate_204,interval = 300,tolerance = 1000

中国大陆   = direct
香港       = url-test,HK-Node1,HK-Node2,url = http://www.gstatic.com/generate_204,interval = 600,tolerance = 1000
台湾       = url-test,TW-Node1,TW-Node2,url = http://www.gstatic.com/generate_204,interval = 600,tolerance = 1500
美国       = url-test,US-Node1,US-Node2,url = http://www.gstatic.com/generate_204,interval = 300,tolerance = 1000
加拿大     = url-test,CA-Node1,CA-Node2,url = http://www.gstatic.com/generate_204,interval = 600,tolerance = 1200
英国       = url-test,GB-Node1,GB-Node2,url = http://www.gstatic.com/generate_204,interval = 600,tolerance = 1200
欧洲       = url-test,DE-Node,FR-Node,NL-Node,IT-Node,ES-Node,url = http://www.gstatic.com/generate_204,interval = 900,tolerance = 1500
澳大利亚   = url-test,AU-Node1,AU-Node2,url = http://www.gstatic.com/generate_204,interval = 900,tolerance = 1500
日本       = url-test,JP-Node1,JP-Node2,url = http://www.gstatic.com/generate_204,interval = 300,tolerance = 1000
韩国       = url-test,KR-Node1,KR-Node2,url = http://www.gstatic.com/generate_204,interval = 600,tolerance = 1500
新加坡     = url-test,SG-Node1,SG-Node2,url = http://www.gstatic.com/generate_204,interval = 600,tolerance = 2000
印度       = url-test,IN-Node1,IN-Node2,url = http://www.gstatic.com/generate_204,interval = 1200,tolerance = 2500
俄罗斯     = url-test,RU-Node1,RU-Node2,url = http://www.gstatic.com/generate_204,interval = 1200,tolerance = 2500
巴西       = url-test,BR-Node1,BR-Node2,url = http://www.gstatic.com/generate_204,interval = 1800,tolerance = 3000
