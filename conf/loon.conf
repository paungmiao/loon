[Remote Filter]
HK-Filter = NameRegex, FilterKey = "(?i)(港|HK|Hong)"
TW-Filter = NameRegex, FilterKey = "(?i)(台|TW|Tai)"
US-Filter = NameRegex, FilterKey = "(?i)(美|United States|US)"
CA-Filter = NameRegex, FilterKey = "(?i)(加|Canada|CA)"
GB-Filter = NameRegex, FilterKey = "(?i)(英|UK|United Kingdom|GB)"
DE-Filter = NameRegex, FilterKey = "(?i)(德|Germany|DE)"
FR-Filter = NameRegex, FilterKey = "(?i)(法|France|FR)"
NL-Filter = NameRegex, FilterKey = "(?i)(荷|Netherlands|NL)"
IT-Filter = NameRegex, FilterKey = "(?i)(意|Italy|IT)"
ES-Filter = NameRegex, FilterKey = "(?i)(西|Spain|ES)"
AU-Filter = NameRegex, FilterKey = "(?i)(澳|Australia|AU)"
JP-Filter = NameRegex, FilterKey = "(?i)(日|JP|Japan)"
KR-Filter = NameRegex, FilterKey = "(?i)(韩|KR|Korea)"
SG-Filter = NameRegex, FilterKey = "(?i)(新|SG|Singapore)"
IN-Filter = NameRegex, FilterKey = "(?i)(印|India|IN)"
RU-Filter = NameRegex, FilterKey = "(?i)(俄|Russia|RU)"
BR-Filter = NameRegex, FilterKey = "(?i)(巴西|BR|Brazil)"
TU-Filter = NameKeyword, FilterKey = "土耳其"
AE-Filter = NameKeyword, FilterKey = "阿联酋|United Arab Emirates"
SA-Filter = NameKeyword, FilterKey = "沙特|Saudi Arabia"
TH-Filter = NameRegex, FilterKey = "(?i)(泰|Thailand|TH)"
MY-Filter = NameKeyword, FilterKey = "马来西亚|Malaysia"
ID-Filter = NameKeyword, FilterKey = "印尼|Indonesia"
PH-Filter = NameKeyword, FilterKey = "菲律宾|Philippines"

